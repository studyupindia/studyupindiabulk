<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Popup</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    	/* Background overlay */
.popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    visibility: hidden;
    opacity: 0;
    transition: visibility 0s, opacity 0.3s ease-in-out;
}

/* Popup box */
.popup-box {
    background: white;
    padding: 20px;
    width: 350px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
}

/* Green checkmark icon */
.popup-icon {
    width: 60px;
    height: 60px;
    background: #28a745;
    color: white;
    font-size: 30px;
    font-weight: bold;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 15px;
}

/* Headline */
.popup-box h2 {
    font-size: 22px;
    margin: 10px 0;
}

/* Description text */
.popup-box p {
    font-size: 14px;
    color: #555;
}

/* OK Button */
#close-btn {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 15px;
    transition: background 0.3s;
}

#close-btn:hover {
    background: #218838;
}

/* Show popup */
.show {
    visibility: visible;
    opacity: 1;
}

    </style>
</head>
<body>

    <!-- Thank You Popup -->
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <div class="popup-icon">
                <span>&#10004;</span> <!-- Checkmark icon -->
            </div>
            <h2>Thank You!</h2>
            <p>Your details have been successfully submitted. Thanks!</p>
            <button id="close-btn">OK</button>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
    const popup = document.getElementById("popup");
    const closeBtn = document.getElementById("close-btn");

    // Show popup after a slight delay
    setTimeout(() => {
        popup.classList.add("show");
    }, 500);

    // Close popup when button is clicked
    closeBtn.addEventListener("click", function() {
        popup.classList.remove("show");
    });
});

    </script>
</body>
</html>
